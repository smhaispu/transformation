<style>

.wrap{max-width:820px;margin:0 auto}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}

 {k:'b',t:'8:00 AM',n:'Breakfast',items:[['2 eggs + 50g spinach (scrambled)',156,14,10.2,2.6, 2.6, 1.1],['150 g plain Skyr',95,16.5,.3,6, 0, 0],['30 g rolled oats',112,4,2.1,18, 1.3, 3],['100 g berries',45,1,.3,10, 0.2, 2]],how:'Stir the oats and berries into the Skyr. Scramble the eggs with spinach on the side.'},

// exercises: id, name, sets, reps, cue
const EX={

function persist(d){
 try{localStorage.setItem(LSK,JSON.stringify(S))}catch(e){}
 if(!dbcol)return;
 dirty[d]=(dirty[d]||0)+1;
 const x=get(d),p=dbcol.doc('d'+d).set({d:d,t:x.t,w:x.w,n:x.n});

async function initStore(){
 try{
  if(!window.claude||!claude.use)throw 0;
  const db=await claude.use('db'),user=await claude.use('user');
  if(!db||!user)throw 0;
  const id=await user.id();if(!id)throw 0;
  dbcol=db.collection('data/users/'+id+'/days_'+profile);
  let first=true;
  dbcol.onSnapshot(snap=>{
   const seen={};let changed=false;
   snap.docs.forEach(ds=>{
    const x=ds.data();if(!x||!x.d)return;seen[x.d]=1;
    if(dirty[x.d]>0||timers[x.d])return;
    const nw={t:x.t||{},w:x.w||'',n:x.n||''};
    if(JSON.stringify(nw)!==JSON.stringify(S[x.d]||{t:{},w:'',n:''})){S[x.d]=nw;changed=true}
   });
   if(first){first=false;Object.keys(S).forEach(k=>{const v=S[k];if(!seen[k]&&(Object.keys(v.t).length||v.w||v.n))persist(+k)})}
   mode='account';setStatus();
   try{localStorage.setItem(LSK,JSON.stringify(S))}catch(e){}
   if(changed&&!document.activeElement.matches('input,textarea'))renderAll();
  },()=>{mode='this device';setStatus()});
 }catch(e){mode='this device';setStatus()}
}

 <div class="card"><h2>How to progress</h2>
 <ul class="tips"><li><b>Days 1 to 14, Learn:</b> light weights, perfect form, stop 3 to 4 reps before failure. Cardio ${cardioMin(1)} minutes.</li><li><b>Days 15 to 35, Build:</b> when you reach the top rep number on every set, add the smallest weight step next session. Cardio ${cardioMin(20)} minutes.</li><li><b>Days 36 to 45, Push:</b> finish sets with 1 to 2 reps left. Cardio ${cardioMin(40)} minutes.</li><li>You will not get bulky from this. Women and men on a small deficit build muscle slowly. The goal is firmer shape and a lower body-fat percentage.</li><li>Sharp pain, dizziness or chest pain: stop and see a doctor. Muscle soreness is normal. Check with a doctor before starting if you have a medical condition.</li></ul></div>`;
}
// ---------- overview ----------
function renderOver(){
 let gymT=0,gymD=0,carT=0,carD=0,full=0,meals=0,streak=0,run=0,ws=[];const td=todayIdx();
 for(let d=1;d<=N;d++){const i=dayInfo(d),x=get(d);
  if(i.s.cardio){carT++;if(sessDone(d))carD++}else{gymT++;if(sessDone(d))gymD++}
  if(prog(d)===100)full++;if(['m_b','m_l','m_s','m_d'].every(k=>x.t[k]))meals++;
  if(x.w)ws.push([d,parseFloat(x.w)]);
  if(d<=td){if(prog(d)>=80)run++;else if(d<td)run=0}}
 streak=run;
 const wtxt=ws.length?`${ws[ws.length-1][1]} kg`:'No entry';const wch=ws.length>1?`${(ws[ws.length-1][1]-ws[0][1]>0?'+':'')}${(ws[ws.length-1][1]-ws[0][1]).toFixed(1)} kg since day ${ws[0][0]}`:'Add weight in a day to see change';
 const off=(dayInfo(1).dt.getDay()+6)%7;
 let cells='';for(let k=0;k<off;k++)cells+='<div></div>';
 const lab={A:'Lower',B:'Upper',C:'Lower',D:'Upper',Z:'Cardio',I:'Cardio',E:'Easy'};
 for(let d=1;d<=N;d++){const i=dayInfo(d),p=prog(d);cells+=`<button class="cell ${d===td?'today':''} ${p===100?'full':''}" style="--p:${p}" data-go="${d}" aria-label="Day ${d}, ${p} percent done"><div class="fill"></div><span>${d}</span><small style="position:relative">${lab[i.k]}</small></button>`}
 document.getElementById('v-over').innerHTML=`
 <div class="card"><h2>Your 45 days</h2><p class="sub">Tap a day to open it. The fill shows how much you ticked.</p>
 <div class="stats"><div class="stat"><b>${gymD}/${gymT}</b><span>Gym sessions done</span></div><div class="stat"><b>${carD}/${carT}</b><span>Cardio sessions done</span></div><div class="stat"><b>${meals}</b><span>Days with all 4 meals</span></div><div class="stat"><b>${full}</b><span>Perfect days (100%)</span></div><div class="stat"><b>${streak}</b><span>Day streak (80% or more)</span></div><div class="stat"><b>${wtxt}</b><span>${wch}</span></div></div></div>
 <div class="card"><div class="cal"><div class="dow">Mon</div><div class="dow">Tue</div><div class="dow">Wed</div><div class="dow">Thu</div><div class="dow">Fri</div><div class="dow">Sat</div><div class="dow">Sun</div>${cells}</div>
 <p class="note">Check-in days: 1, 15, 30 and 45. Weigh in, measure your waist and take photos.</p></div>`;
}
function renderAll(){renderHeader();renderDay();renderPlan();renderOver()}
function showTab(n){tab=n;['day','plan','over'].forEach(x=>{document.getElementById('v-'+x).classList.toggle('hide',x!==n);document.getElementById('tab-'+x).setAttribute('aria-selected',x===n)});if(n==='over')renderOver();window.scrollTo(0,0)}
document.addEventListener('click',e=>{
 const tb=e.target.closest('nav.tabs button');if(tb){showTab(tb.dataset.tab);return}
 const t=e.target.closest('button.tick');
 if(t){const k=t.dataset.k,x=get(cur);if(x.t[k])delete x.t[k];else x.t[k]=1;persist(cur);const y=window.scrollY;renderDay();window.scrollTo(0,y);return}
 const n=e.target.closest('[data-nav]');
 if(n){const v=n.dataset.nav;cur=v==='today'?todayIdx():Math.min(N,Math.max(1,cur+ +v));renderDay();window.scrollTo(0,0);return}
 const g=e.target.closest('[data-go]');if(g){cur=+g.dataset.go;renderDay();showTab('day')}
});
document.addEventListener('input', e=>{
 if(e.target.classList.contains('w-input')){
    const x=get(cur);
    x.t[e.target.dataset.wk] = e.target.value;
    persistLater(cur);
 }
});
renderAll();setStatus();initStore();
</script>

</body></html>
